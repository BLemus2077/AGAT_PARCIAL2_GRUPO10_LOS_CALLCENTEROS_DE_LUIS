version: "3.9"

services:
  java_app:
    container_name: java_app
    image: loscallcenterosdeluis2025daw:1.0
    build: .
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://java_db:5432/postgres
      - spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
      - spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
      - spring.security.oauth2.client.provider.auth0.issuer-uri=https://${AUTH0_DOMAIN}/
      - spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
      - spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}
      - spring.datasource.url=${SPRING_DATASOURCE_URL}
      - spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
      - spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


    volumes:
      - ./src/main/resources:/app/src/main/resources
      - ./src/main/templates:/app/src/main/templates
    depends_on:
      - java_db

  java_db:
    container_name: java_db
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: