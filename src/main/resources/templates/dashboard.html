<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <!-- Auth0 SDK -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
</head>
<body>
<div class="container mt-5 text-center">
    <!-- Logo centrado -->
    <img th:src="@{/img/AGAT_LOGO.png}" alt="Logo AGAT" style="width: 400px;" class="img-fluid mb-4">

    <h2 class="mb-3 fw-bold titulo-principal">Dashboard</h2>
    <p class="text-muted">Inicio de sesión exitoso.</p>

    <!-- Botones estilo tarjetas -->
    <div class="row mt-4 justify-content-center">
        <div class="col-md-3 mb-3">
            <a href="/estudiantes" class="text-decoration-none">
                <div class="card shadow-sm rounded p-4">
                    <div class="d-flex align-items-center gap-2 justify-content-center">
                        🎓
                        <h5 class="m-0">Estudiantes</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/grupos" class="text-decoration-none">
                <div class="card shadow-sm rounded p-4">
                    <div class="d-flex align-items-center gap-2 justify-content-center">
                        👥
                        <h5 class="m-0">Grupos</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/asistencias" class="text-decoration-none">
                <div class="card shadow-sm rounded p-4">
                    <div class="d-flex align-items-center gap-2 justify-content-center">
                        📝
                        <h5 class="m-0">Asistencias</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/reportes" class="text-decoration-none">
                <div class="card shadow-sm rounded p-4">
                    <div class="d-flex align-items-center gap-2 justify-content-center">
                        📊
                        <h5 class="m-0">Reportes</h5>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- 🔐 Guardar el JWT después del login -->
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const auth0 = await createAuth0Client({
      domain: "dev-bb6l82r5jx2gzjjy.us.auth0.com",           // Reemplaza con tu dominio real
      client_id: "FAsdNp49vHdzGr7XVCXCKSTJoh2oKTqq",                // Reemplaza con tu Client ID real
      audience: "https://agat.api"              // Debe coincidir con el audience de tu API
    });

    try {
      const token = await auth0.getTokenSilently();
      sessionStorage.setItem("access_token", token);
      console.log("Token JWT guardado en sessionStorage");
    } catch (e) {
      console.error("No se pudo obtener el token:", e);
    }
  });
</script>
</body>
</html>
